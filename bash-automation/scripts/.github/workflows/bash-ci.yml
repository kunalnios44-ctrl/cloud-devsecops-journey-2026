name: Bash Scripts CI Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'bash-automation/scripts/**'
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set Execution Permission on Scripts
        run: chmod +x bash-automation/scripts/*.sh

      - name: Run Bash Syntax Check
        run: |
          echo "Checking syntax for all bash automation scripts..."
          for script in bash-automation/scripts/*.sh; do
            if [ -f "$script" ]; then
              echo "Validating: $script"
              bash -n "$script"
            fi
          done
          echo "All scripts passed syntax validation successfully!"
          
