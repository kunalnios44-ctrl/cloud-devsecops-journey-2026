apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nordic-nexus-demo
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nordic-nexus
spec:
  project: default
  source:
    repoURL: https://github.com/kunalnios44-ctrl/cloud-devsecops-journey-2026.git
    targetRevision: main
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
