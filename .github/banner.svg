<svg width="1000" height="220" viewBox="0 0 1000 220" xmlns="http://w3.org">
  <defs>
    <linearGradient id="vipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="50%" stop-color="#112240" />
      <stop offset="100%" stop-color="#020C1B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64FFDA" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
  </defs>

  <!-- Main Dark Navy VIP Card -->
  <rect width="1000" height="220" rx="14" fill="url(#vipGrad)" />
  <rect x="2" y="2" width="996" height="216" rx="13" fill="none" stroke="#233554" stroke-width="2" />

  <!-- Top Accent Line -->
  <rect x="40" y="32" width="80" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Name & Title -->
  <text x="40" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="1">
    KUNAL KASHYAP
  </text>
  <text x="40" y="125" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#64FFDA" letter-spacing="0.5">
    Cloud &amp; DevSecOps Engineer  |  Zero-Trust Infrastructure
  </text>

  <!-- Status Pills inside Banner -->
  <rect x="40" y="152" width="210" height="32" rx="6" fill="#1D3557" stroke="#457B9D" stroke-width="1" />
  <text x="145" y="173" font-family="monospace" font-size="13" font-weight="bold" fill="#A8DADC" text-anchor="middle">
    CI/CD: AUTOMATED &amp; GREEN
  </text>

  <rect x="265" y="152" width="225" height="32" rx="6" fill="#1B4332" stroke="#40916C" stroke-width="1" />
  <text x="377" y="173" font-family="monospace" font-size="13" font-weight="bold" fill="#95D5B2" text-anchor="middle">
    TARGET: DK • SE • FI • EU
  </text>

  <rect x="505" y="152" width="220" height="32" rx="6" fill="#3D1308" stroke="#9E2A2B" stroke-width="1" />
  <text x="615" y="173" font-family="monospace" font-size="13" font-weight="bold" fill="#F4A261" text-anchor="middle">
    SECURITY: ZERO-TRUST
  </text>
</svg>
    
