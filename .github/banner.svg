<svg width="1000" height="240" viewBox="0 0 1000 240" xmlns="http://w3.org">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>
    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#00BBF9" />
      <stop offset="100%" stop-color="#9B5DE5" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.8" />
    </pattern>
  </defs>

  <!-- Base Card -->
  <rect width="1000" height="240" rx="16" fill="url(#bgGrad)" />
  <rect width="1000" height="240" rx="16" fill="url(#grid)" opacity="0.5" />
  <rect x="2" y="2" width="996" height="236" rx="15" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Top Neon Bar -->
  <rect x="0" y="0" width="1000" height="6" rx="3" fill="url(#neonLine)" />

  
  <text x="45" y="65" font-family="monospace" font-size="14" font-weight="bold" fill="#00F5D4" letter-spacing="2">
    // ENTERPRISE CLOUD &amp; DEVSECOPS PORTFOLIO [v2.0]
  </text>
  <text x="45" y="115" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">
    KUNAL KASHYAP
  </text>
  <text x="45" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" fill="#94A3B8">
    Cloud Security • Kubernetes Orchestration • Shift-Left Automation
  </text>

  <!-- Bottom Badges -->
  <rect x="45" y="175" width="230" height="34" rx="8" fill="#0F172A" stroke="#00F5D4" stroke-width="1.5" />
  <text x="160" y="197" font-family="monospace" font-size="13" font-weight="bold" fill="#00F5D4" text-anchor="middle">
    ● PIPELINE: 100% VERIFIED
  </text>

  <rect x="290" y="175" width="245" height="34" rx="8" fill="#0F172A" stroke="#00BBF9" stroke-width="1.5" />
  <text x="412" y="197" font-family="monospace" font-size="13" font-weight="bold" fill="#00BBF9" text-anchor="middle">
    🌍 EU TARGET: DK | SE | FI
  </text>

  <rect x="550" y="175" width="225" height="34" rx="8" fill="#0F172A" stroke="#9B5DE5" stroke-width="1.5" />
  <text x="662" y="197" font-family="monospace" font-size="13" font-weight="bold" fill="#E0AAFF" text-anchor="middle">
    🛡️ ZERO-TRUST ENFORCED
  </text>

  <!-- Right Side Decorative Tech Emblem -->
  <circle cx="885" cy="120" r="62" fill="#0F172A" stroke="url(#neonLine)" stroke-width="3" />
  <circle cx="885" cy="120" r="48" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="885" y="115" font-family="monospace" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    DEVSEC
  </text>
  <text x="885" y="138" font-family="monospace" font-size="16" font-weight="bold" fill="#00F5D4" text-anchor="middle">
    OPS
  </text>
</svg>
    
