name: Enterprise Cloud DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devsecops-gate:
    name: Static Security & IaC Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Repository Assets
        run: |
          set -euo pipefail
          test -f "aws-cloud-security/s3-bucket-policy.json"
          test -f "aws-cloud-security/aws-cloud-security/enforce-s3-security.sh"

      - name: Validate & Audit AWS S3 Policy
        run: |
          python3 - << 'EOF'
          import json, sys

          policy_path = "aws-cloud-security/s3-bucket-policy.json"
          with open(policy_path, "r", encoding="utf-8") as f:
              policy = json.load(f)

          if "Statement" not in policy or not isinstance(policy["Statement"], list):
              print("ERROR: Invalid IAM/S3 policy structure. Missing 'Statement' list.")
              sys.exit(1)

          for idx, stmt in enumerate(policy["Statement"]):
              effect = stmt.get("Effect")
              principal = stmt.get("Principal")
              condition = stmt.get("Condition")
              if effect == "Allow" and principal == "*" and not condition:
                  print(f"SECURITY VIOLATION [Statement {idx}]: Unconditional public wildcard access ('Principal': '*') is prohibited.")
                  sys.exit(1)

          print("VERIFIED: AWS S3 bucket policy passed strict security compliance.")
          EOF

      - name: Lint & Security Scan Shell Scripts
        run: |
          set -euo pipefail
          SCRIPT="aws-cloud-security/aws-cloud-security/enforce-s3-security.sh"
          bash -n "$SCRIPT"
          shellcheck -x -S warning "$SCRIPT"

      - name: Validate Python & Terraform HCL (Auto-Detect)
        run: |
          set -euo pipefail
          if find . -name "*.py" | grep -q .; then
            python3 -m py_compile $(find . -name "*.py")
          fi
          if find . -name "*.tf" | grep -q .; then
            terraform fmt -check -recursive
          fi
          
