name: Zero-Trust Go Security Sentinel & Race Gate

on:
  push:
    branches:
      - main
    paths:
      - 'network-diagnostics/**'
      - '.github/workflows/zero-trust-go-sentinel.yml'
  workflow_dispatch:

jobs:
  go-security-verification:
    name: Go 1.23 Vet, Race-Test & Binary Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: network-diagnostics

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go 1.23 Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Auto-Format Go Code (gofmt)
        run: gofmt -w .

      - name: Run Static Analysis (go vet)
        run: go vet ./...

      - name: Run Unit & Race Condition Tests
        run: go test -v -race ./...

      - name: Build Production Go Security Probe
        run: go build -v -o security_probe .
        
