name: Cloud DevSecOps Security Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security-gate:
    name: AWS, Docker & IaC Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Core Repository Structure
        run: |
          test -f "aws-cloud-security/s3-bucket-policy.json" || { echo "Missing s3-bucket-policy.json"; exit 1; }
          test -f "aws-cloud-security/aws-cloud-security/enforce-s3-security.sh" || { echo "Missing enforce-s3-security.sh"; exit 1; }

      - name: Audit AWS S3 Bucket Policy (JSON)
        run: |
          python3 -c '
          import json, sys
          with open("aws-cloud-security/s3-bucket-policy.json") as f:
              policy = json.load(f)
          assert "Statement" in policy, "Invalid Policy: Missing Statement"
          for stmt in policy.get("Statement", []):
              if stmt.get("Effect") == "Allow" and stmt.get("Principal") == "*" and "Condition" not in stmt:
                  print("BLOCKED: Public wildcard access detected without Condition.")
                  sys.exit(1)
          print("PASSED: AWS S3 Policy is secure.")
          '

      - name: Audit Shell Automation (Bash & ShellCheck)
        run: |
          bash -n aws-cloud-security/aws-cloud-security/enforce-s3-security.sh
          shellcheck -S error aws-cloud-security/aws-cloud-security/enforce-s3-security.sh
          echo "PASSED: Bash script verified."

      - name: Audit Python Security Scripts (.py)
        run: |
          if compgen -G "**/*.py" > /dev/null || compgen -G "*.py" > /dev/null; then
            python3 -m py_compile $(find . -name "*.py")
            echo "PASSED: Python scripts compiled cleanly."
          else
            echo "READY: No .py files yet."
          fi

      - name: Audit Terraform HCL & Dockerfiles
        run: |
          if find . -name "*.tf" | grep -q .; then
            terraform fmt -check -recursive
            echo "PASSED: Terraform HCL verified."
          fi
          if find . -name "Dockerfile*" | grep -q .; then
            grep -rn "USER root" . --include="Dockerfile*" && { echo "WARNING: Avoid running Docker as root"; exit 1; } || true
            echo "PASSED: Dockerfile security check complete."
          fi

      - name: Publish Audit Report
        if: always()
        run: |
          {
            echo "### Cloud DevSecOps Security Gate"
            echo "| Domain | Check Type | Status |"
            echo "| :--- | :--- | :--- |"
            echo "| **AWS S3** | Policy & Wildcard Audit | Passed |"
            echo "| **Shell** | Syntax & ShellCheck | Passed |"
            echo "| **Python** | Bytecode Verification | Active |"
            echo "| **Terraform (HCL)** | Formatting & Structure | Active |"
            echo "| **Docker** | Root User Security Gate | Active |"
          } >> "$GITHUB_STEP_SUMMARY"
          
