
name: AWS S3 Security CI/CD Audit

on:
  push:
    paths:
      - "aws-cloud-security/**"
      - ".github/workflows/aws-s3-security-ci.yml"

  pull_request:
    paths:
      - "aws-cloud-security/**"
      - ".github/workflows/aws-s3-security-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: AWS S3 Static Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check required files
        run: |
          test -f aws-cloud-security/s3-bucket-policy.json
          test -f aws-cloud-security/enforce-s3-security.sh

      - name: Check executable permission
        run: |
          test -x aws-cloud-security/enforce-s3-security.sh

      - name: Validate JSON syntax
        run: |
          python -m json.tool \
            aws-cloud-security/s3-bucket-policy.json \
            > /dev/null

      - name: Deep policy validation
        run: |
          python - <<'PY'
          import json
          import re

          path = "aws-cloud-security/s3-bucket-policy.json"

          with open(path, encoding="utf-8") as file:
              policy = json.load(file)

          assert isinstance(policy, dict)
          assert policy.get("Version") == "2012-10-17"

          statements = policy.get("Statement")
          assert isinstance(statements, list)

          expected = {
              "DenyInsecureTransport",
              "DenyIncorrectExplicitEncryption",
              "DenyCustomerProvidedEncryption"
          }

          assert len(statements) == 3
          assert {s.get("Sid") for s in statements} == expected

          for statement in statements:
              assert statement.get("Effect") == "Deny"
              assert statement.get("Principal") == "*"

              resources = statement.get("Resource")
              if isinstance(resources, str):
                  resources = [resources]

              assert isinstance(resources, list) and resources

              for resource in resources:
                  assert isinstance(resource, str)
                  assert "YOUR_BUCKET_NAME" not in resource
                  assert re.fullmatch(
                      r"arn:aws:s3:::[a-z0-9][a-z0-9.-]{1,61}[a-z0-9](/\*)?",
                      resource
                  ), f"Invalid S3 ARN: {resource}"

              assert "Action" in statement
              assert isinstance(statement["Action"], (str, list))
              assert "Condition" in statement
              assert isinstance(statement["Condition"], dict)
              assert statement["Condition"]

          by_sid = {s["Sid"]: s for s in statements}

          transport = by_sid["DenyInsecureTransport"]
          assert transport["Condition"].get("Bool", {}).get(
              "aws:SecureTransport"
          ) is False

          encryption = by_sid["DenyIncorrectExplicitEncryption"]
          assert encryption["Condition"]

          customer_key = by_sid["DenyCustomerProvidedEncryption"]
          assert customer_key["Condition"]

          print("Deep policy structure validation passed.")
          PY

      - name: Validate Bash syntax
        run: |
          bash -n aws-cloud-security/enforce-s3-security.sh

      - name: Run ShellCheck
        run: |
          shellcheck --severity=warning \
            aws-cloud-security/enforce-s3-security.sh

      - name: Test policy rendering and validation
        run: |
          bash aws-cloud-security/enforce-s3-security.sh --validate-only

      - name: Security audit completed
        run: |
          echo "All static security audit checks passed."
          
