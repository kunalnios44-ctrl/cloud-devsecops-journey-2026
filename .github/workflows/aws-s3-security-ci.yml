
name: AWS S3 Security CI/CD Audit

on:
  push:
    paths:
      - "aws-cloud-security/**"
      - ".github/workflows/aws-s3-security-ci.yml"

  pull_request:
    paths:
      - "aws-cloud-security/**"
      - ".github/workflows/aws-s3-security-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-s3-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: AWS S3 Static Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Locate and verify required files
        id: files
        shell: bash
        run: |
          set -euo pipefail

          find_unique_file() {
            local filename="$1"
            local -a matches=()

            mapfile -t matches < <(
              find . -type f \
                -name "$filename" \
                -not -path './.git/*' \
                -print
            )

            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one $filename, found ${#matches[@]}"
              printf '%s\n' "${matches[@]}"
              exit 1
            fi

            printf '%s' "${matches[0]#./}"
          }

          POLICY_FILE="$(find_unique_file s3-bucket-policy.json)"
          SCRIPT_FILE="$(find_unique_file enforce-s3-security.sh)"

          echo "policy=$POLICY_FILE" >> "$GITHUB_OUTPUT"
          echo "script=$SCRIPT_FILE" >> "$GITHUB_OUTPUT"

          echo "Policy: $POLICY_FILE"
          echo "Script: $SCRIPT_FILE"

      - name: Validate JSON syntax
        shell: bash
        env:
          POLICY_FILE: ${{ steps.files.outputs.policy }}
        run: |
          set -euo pipefail

          python -m json.tool "$POLICY_FILE" > /dev/null

          echo "JSON syntax validation passed."

      - name: Deep policy validation
        shell: bash
        env:
          POLICY_FILE: ${{ steps.files.outputs.policy }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import sys

          path = os.environ["POLICY_FILE"]

          with open(path, encoding="utf-8") as file:
              policy = json.load(file)

          if not isinstance(policy, dict):
              sys.exit("ERROR: Policy must be a JSON object.")

          if policy.get("Version") != "2012-10-17":
              sys.exit("ERROR: Invalid policy version.")

          statements = policy.get("Statement")

          if isinstance(statements, dict):
              statements = [statements]

          if not isinstance(statements, list):
              sys.exit("ERROR: Statement must be a list or object.")

          expected = {
              "DenyInsecureTransport",
              "DenyIncorrectExplicitEncryption",
              "DenyCustomerProvidedEncryption",
          }

          actual = [s.get("Sid") for s in statements
                    if isinstance(s, dict)]

          if len(statements) != 3 or set(actual) != expected:
              sys.exit(f"ERROR: Unexpected policy statements: {actual}")

          for statement in statements:
              if statement.get("Effect") != "Deny":
                  sys.exit("ERROR: Expected Deny effect.")

              if statement.get("Principal") != "*":
                  sys.exit("ERROR: Unexpected Principal.")

              resources = statement.get("Resource")

              if isinstance(resources, str):
                  resources = [resources]

              if not isinstance(resources, list) or not resources:
                  sys.exit("ERROR: Missing Resource.")

              for resource in resources:
                  if (
                      not isinstance(resource, str)
                      or not resource.startswith("arn:aws:s3:::")
                  ):
                      sys.exit("ERROR: Invalid S3 resource ARN.")

          print("Deep policy validation passed.")
          PY

      - name: Validate Bash syntax
        shell: bash
        env:
          SCRIPT_FILE: ${{ steps.files.outputs.script }}
        run: |
          set -euo pipefail

          bash -n "$SCRIPT_FILE"

          echo "Bash syntax validation passed."

      - name: Install ShellCheck
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

          shellcheck --version

      - name: Run ShellCheck
        shell: bash
        env:
          SCRIPT_FILE: ${{ steps.files.outputs.script }}
        run: |
          set -euo pipefail

          shellcheck --severity=warning "$SCRIPT_FILE"

          echo "ShellCheck validation passed."

      - name: Run S3 policy validation
        shell: bash
        env:
          SCRIPT_FILE: ${{ steps.files.outputs.script }}
        run: |
          set -euo pipefail

          bash "$SCRIPT_FILE" --validate-only

          echo "S3 policy validation passed."

      - name: Security audit summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================="
          echo " AWS S3 SECURITY AUDIT: PASSED"
          echo "=================================="
          echo "File detection: PASSED"
          echo "JSON validation: PASSED"
          echo "Policy validation: PASSED"
          echo "Bash syntax: PASSED"
          echo "ShellCheck: PASSED"
          echo "S3 validation: PASSED"
          echo "=================================="
          
