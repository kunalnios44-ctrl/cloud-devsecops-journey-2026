
name: Platform Guardrail CI

on:
  push:
    branches: ["main"]
    paths:
      - "platform-guardrail/**"
      - ".github/workflows/platform-guardrail-ci.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "platform-guardrail/**"
      - ".github/workflows/platform-guardrail-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrail-verification:
    name: Go Platform Guardrail Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: platform-guardrail

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: platform-guardrail/go.mod
          cache: true
          cache-dependency-path: platform-guardrail/go.mod

      - name: Check formatting
        run: |
          test -z "$(gofmt -l main.go main_test.go)"

      - name: Run static analysis
        run: go vet ./...

      - name: Run unit tests with race detector
        run: go test -v -race -cover ./...

      - name: Verify CLI against sample config
        run: go run .
        
