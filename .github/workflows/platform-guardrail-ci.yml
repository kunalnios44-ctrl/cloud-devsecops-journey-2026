
name: Platform Guardrail CI

on:
  push:
    branches:
      - main
    paths:
      - "platform-guardrail/**"
      - ".github/workflows/platform-guardrail-ci.yml"

  pull_request:
    paths:
      - "platform-guardrail/**"
      - ".github/workflows/platform-guardrail-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-guardrail-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrail-verification:
    name: Go Platform Guardrail Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: platform-guardrail

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: platform-guardrail/go.mod
          cache: false

      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail
          test -f go.mod
          test -f main.go
          test -f main_test.go
          test -f config.json
          echo "Project files verified."

      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail

          UNFORMATTED="$(gofmt -l .)"

          if [ -n "$UNFORMATTED" ]; then
            echo "Formatting errors:"
            echo "$UNFORMATTED"
            exit 1
          fi

          echo "Formatting passed."

      - name: Verify Go modules
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -race ./...

      - name: Generate Coverage Report
        run: |
          set -euo pipefail

          go test -race \
            -coverprofile=coverage.out \
            -covermode=atomic ./...

          go tool cover -func=coverage.out

      - name: Validate Coverage Report
        run: test -s coverage.out

      - name: Verify Platform Configuration
        run: go run . config.json

      - name: Upload Coverage Artifact
        if: always() && hashFiles('platform-guardrail/coverage.out') != ''
        uses: actions/upload-artifact@v7
        with:
          name: platform-guardrail-coverage
          path: platform-guardrail/coverage.out
          if-no-files-found: error
          retention-days: 14

      - name: CI Verification Summary
        if: success()
        run: |
          {
            echo "## Platform Guardrail CI"
            echo ""
            echo "- Formatting: PASSED"
            echo "- Go modules: PASSED"
            echo "- Go vet: PASSED"
            echo "- Unit tests: PASSED"
            echo "- Race detector: PASSED"
            echo "- Coverage: PASSED"
            echo "- CLI verification: PASSED"
            echo ""
            echo "**Overall: SUCCESS**"
          } >> "$GITHUB_STEP_SUMMARY"
          
