name: Linux CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Make health check executable
        run: chmod +x linux-health-check.sh

      - name: Run health check
        run: ./linux-health-check.sh
