
name: Global Enterprise Hardened DevSecOps Pipeline (SLSA-L3 & Zero-Trust)

on:
  push:
    branches: ["main", "master", "release/*"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.22"
  PYTHON_VERSION: "3.11"

jobs:

  # ============================================================
  # STAGE 1 - SECRET DETECTION
  # ============================================================
  stage-1-secret-hygiene:
    name: "1. Secret & Credential Security"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Audit
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TruffleHog Verified Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ============================================================
  # STAGE 2 - SAST
  # ============================================================
  stage-2-sast-analysis:
    name: "2. SAST & Static Code Security"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Semgrep Security Audit
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/security-audit

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.8
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run Gosec Across All Go Modules
        shell: bash
        run: |
          found=0
          while IFS= read -r -d '' mod; do
            found=1
            dir="$(dirname "$mod")"
            echo "Scanning Go module: $dir"
            (
              cd "$dir"
              gosec ./...
            )
          done < <(find . -name go.mod -not -path './vendor/*' -print0)

          if [[ "$found" -eq 0 ]]; then
            echo "No Go modules found; Gosec not applicable."
          fi

  # ============================================================
  # STAGE 3 - SCA / CVE
  # ============================================================
  stage-3-sca-dependencies:
    name: "3. Dependency & CVE Security"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: OSV Scanner Dependency Audit
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.1
        with:
          scan-args: |-
            -r .

  # ============================================================
  # STAGE 4 - INFRASTRUCTURE SECURITY
  # ============================================================
  stage-4-iac-cloud-governance:
    name: "4. IaC & Cloud Compliance"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkov Strict Policy Audit
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          soft_fail: false
          framework: terraform,kubernetes,dockerfile,github_actions

      - name: Trivy Filesystem & IaC Audit
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # ============================================================
  # STAGE 5 - SCRIPT SECURITY
  # ============================================================
  stage-5-scripts-hardening:
    name: "5. Bash & Python Security"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: ShellCheck Audit
        shell: bash
        run: |
          found=0
          while IFS= read -r -d '' file; do
            found=1
            echo "Checking: $file"
            shellcheck -S warning "$file"
          done < <(find . -type f -name '*.sh' -print0)

          if [[ "$found" -eq 0 ]]; then
            echo "No shell scripts found."
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python Security Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit safety

      - name: Bandit Python SAST
        run: |
          bandit -r . -ll -x ./.git,./.venv,./venv

      - name: Safety Dependency Audit
        shell: bash
        run: |
          found=0
          while IFS= read -r -d '' file; do
            found=1
            echo "Auditing: $file"
            safety scan --target "$file"
          done < <(find . -type f -name 'requirements*.txt' -print0)

          if [[ "$found" -eq 0 ]]; then
            echo "No requirements files found."
          fi

  # ============================================================
  # STAGE 6 - GO ENGINEERING & PROVENANCE
  # ============================================================
  stage-6-go-engineering-slsa:
    name: "6. Go Build, Race Testing & Provenance"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go Verification & Build
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          found=0

          while IFS= read -r -d '' mod; do
            found=1
            dir="$(dirname "$mod")"
            module_id="$(printf '%s' "$dir" | sed 's#^\./##; s#[^A-Za-z0-9._-]#-#g')"

            echo "Processing module: $dir"

            (
              cd "$dir"

              go mod verify
              go vet ./...

              go test -race -coverprofile="$GITHUB_WORKSPACE/dist/${module_id}-coverage.out" ./...

              package_name="$(go list -f '{{.Name}}' .)"

              if [[ "$package_name" == "main" ]]; then
                GOOS=linux GOARCH=amd64 go build \
                  -trimpath \
                  -ldflags="-s -w" \
                  -o "$GITHUB_WORKSPACE/dist/${module_id}-linux-amd64" .
              else
                echo "Library module: tests completed; no executable generated."
              fi
            )
          done < <(find . -name go.mod -not -path './vendor/*' -print0)

          if [[ "$found" -eq 0 ]]; then
            echo "No Go modules found."
          fi

      - name: Upload Go Build Evidence
        if: hashFiles('dist/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: go-build-evidence
          path: dist/
          if-no-files-found: error

      - name: Generate GitHub Build Provenance Attestation
        if: hashFiles('dist/*') != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

  # ============================================================
  # STAGE 7 - CONTAINER SECURITY & SBOM
  # ============================================================
  stage-7-container-supply-chain:
    name: "7. Container Security & SBOM"
    runs-on: ubuntu-latest

    needs:
      - stage-1-secret-hygiene
      - stage-2-sast-analysis

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Hadolint, Docker Build & Image CVE Scan
        shell: bash
        run: |
          found=0
          index=0

          while IFS= read -r -d '' df; do
            found=1
            index=$((index + 1))
            dir="$(dirname "$df")"
            image="sec-audit-image:${index}"

            echo "Linting: $df"
            docker run --rm -i hadolint/hadolint < "$df"

            echo "Building: $image"
            docker build --file "$df" --tag "$image" "$dir"

            echo "Scanning: $image"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.58.2 \
              image --exit-code 1 \
              --severity CRITICAL,HIGH "$image"

          done < <(find . -type f -name 'Dockerfile*' -not -path './vendor/*' -print0)

          if [[ "$found" -eq 0 ]]; then
            echo "No Dockerfiles found; container checks not applicable."
          fi

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: global-enterprise-sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: global-enterprise-sbom
          path: global-enterprise-sbom.spdx.json
          if-no-files-found: error

  # ============================================================
  # STAGE 8 - RUNTIME SECURITY
  # ============================================================
  stage-8-zero-trust-runtime-probe:
    name: "8. Runtime TLS & HTTP Security Verification"
    runs-on: ubuntu-latest

    needs:
      - stage-6-go-engineering-slsa
      - stage-7-container-supply-chain

    steps:
      - name: Verify Configured Application Endpoint
        env:
          DAST_TARGET_URL: ${{ vars.DAST_TARGET_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${DAST_TARGET_URL:-}" ]]; then
            echo "::error::Configure repository variable DAST_TARGET_URL."
            exit 1
          fi

          if [[ "$DAST_TARGET_URL" != https://* ]]; then
            echo "::error::Only HTTPS endpoints are permitted."
            exit 1
          fi

          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT

          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --dump-header "$headers" \
            --output /dev/null \
            "$DAST_TARGET_URL"

          grep -qi '^strict-transport-security:' "$headers"
          grep -qi '^content-security-policy:' "$headers"

          echo "HTTPS, HSTS and CSP header checks passed."

  # ============================================================
  # STAGE 9 - KUBERNETES CONFIGURATION VALIDATION
  # ============================================================
  stage-9-resilience-validation:
    name: "9. Kubernetes Resilience Configuration"
    runs-on: ubuntu-latest

    needs:
      - stage-4-iac-cloud-governance
      - stage-8-zero-trust-runtime-probe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Kubeconform
        run: |
          curl -fsSL \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            -o /tmp/kubeconform.tar.gz

          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Validate Kubernetes Manifests
        shell: bash
        run: |
          found=0

          while IFS= read -r -d '' file; do
            found=1
            echo "Validating: $file"
            kubeconform -strict -summary "$file"
          done < <(
            find . -type f \
              \( -path '*/k8s/*' -o -path '*/kubernetes/*' \) \
              \( -name '*.yaml' -o -name '*.yml' \) \
              -print0
          )

          if [[ "$found" -eq 0 ]]; then
            echo "No Kubernetes manifests found."
          fi

  # ============================================================
  # STAGE 10 - EXECUTIVE RELEASE GATE
  # ============================================================
  stage-10-executive-release-gate:
    name: "10. Enterprise Zero-Trust Release Gate"
    runs-on: ubuntu-latest

    needs:
      - stage-1-secret-hygiene
      - stage-2-sast-analysis
      - stage-3-sca-dependencies
      - stage-4-iac-cloud-governance
      - stage-5-scripts-hardening
      - stage-6-go-engineering-slsa
      - stage-7-container-supply-chain
      - stage-8-zero-trust-runtime-probe
      - stage-9-resilience-validation

    if: always()

    steps:
      - name: Enforce All Upstream Job Results
        shell: bash
        env:
          SECRET: ${{ needs.stage-1-secret-hygiene.result }}
          SAST: ${{ needs.stage-2-sast-analysis.result }}
          SCA: ${{ needs.stage-3-sca-dependencies.result }}
          IAC: ${{ needs.stage-4-iac-cloud-governance.result }}
          SCRIPTS: ${{ needs.stage-5-scripts-hardening.result }}
          GO: ${{ needs.stage-6-go-engineering-slsa.result }}
          CONTAINERS: ${{ needs.stage-7-container-supply-chain.result }}
          RUNTIME: ${{ needs.stage-8-zero-trust-runtime-probe.result }}
          RESILIENCE: ${{ needs.stage-9-resilience-validation.result }}

        run: |
          set -euo pipefail

          failed=0

          for job in \
            SECRET SAST SCA IAC SCRIPTS GO \
            CONTAINERS RUNTIME RESILIENCE
          do
            result="${!job}"
            echo "$job: $result"

            if [[ "$result" != "success" ]]; then
              echo "::error::$job did not succeed."
              failed=1
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            echo "ENTERPRISE RELEASE GATE: FAIL"
            exit 1
          fi

          echo "================================================"
          echo "GLOBAL ENTERPRISE DEVSECOPS PIPELINE: PASS"
          echo "All required upstream jobs succeeded."
          echo "================================================"
          
