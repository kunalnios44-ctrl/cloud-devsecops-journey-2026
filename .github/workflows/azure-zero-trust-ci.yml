name: Azure Zero-Trust Terraform CI

on:
  push:
    branches:
      - main
    paths:
      - 'azure-zero-trust/**'
      - '.github/workflows/azure-zero-trust-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'azure-zero-trust/**'
      - '.github/workflows/azure-zero-trust-ci.yml'
  schedule:
    # Daily automated static configuration and security policy compliance check
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-verify:
    name: Strict Format, Validate & Security Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./azure-zero-trust

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
          terraform_wrapper: false

      - name: Terraform Format Check (Strict Recursive)
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init (Backend Disabled)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Checkov DevSecOps Security Gate
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: ./azure-zero-trust
          framework: terraform
          output_format: cli
          soft_fail: false
          
