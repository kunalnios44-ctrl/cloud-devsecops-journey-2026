name: Enterprise Cloud & DevSecOps Security Platform

on:
  push:
    branches: [main, master, develop, "release/**"]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.22"
  PYTHON_VERSION: "3.11"

jobs:
  stage-1-secret-guard:
    name: "1. Secret & Credential Security"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify Authorized Actor
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.actor }}" != "${{ github.repository_owner }}" ]]; then
            echo "::error::SECURITY ALERT - Unauthorized push actor detected!"
            exit 1
          fi

      - name: Checkout Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Audit
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TruffleHog Verified Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  stage-2-sast:
    name: "2. Multi-Language SAST"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Semgrep Security Audit
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/security-audit

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install & Run Gosec
        shell: bash
        run: |
          go install ://github.com
          export PATH="$PATH:$(go env GOPATH)/bin"
          while IFS= read -r -d '' mod; do
            dir="$(dirname "$mod")"
            echo "Scanning: $dir"
            (cd "$dir" && gosec -no-fail ./...)
          done < <(find . -name go.mod -not -path "./vendor/*" -print0)

  stage-3-sca:
    name: "3. Dependency & CVE Audit"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.1
        continue-on-error: true
        with:
          scan-args: |-
            -r .

  stage-4-iac:
    name: "4. Multi-Cloud IaC Governance"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkov Security Audit
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          soft_fail: true
          framework: terraform,kubernetes,dockerfile,github_actions,arm,cloudformation

      - name: Trivy Filesystem Security Audit
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "0"

  stage-5-scripts:
    name: "5. Bash & Python Hardening"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: ShellCheck Audit
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          while IFS= read -r -d '' file; do
            echo "Checking: $file"
            shellcheck -S error "$file"
          done < <(find . -type f -name "*.sh" -not -path "./vendor/*" -print0)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bandit Security Audit
        shell: bash
        run: |
          mapfile -d '' files < <(find . -type f -name "*.py" -not -path "./.venv/*" -not -path "./venv/*" -print0)
          if (( ${#files[@]} > 0 )); then
            python -m pip install --quiet bandit
            bandit -r . -ll -x ./.git,./.venv,./venv
          else
            echo "No Python files found."
          fi

  stage-6-go-engineering:
    name: "6. Go Build, Vet, Race & Provenance"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go Module Verification & Build
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          while IFS= read -r -d '' mod; do
            dir="$(dirname "$mod")"
            module_name="$(printf '%s' "$dir" | sed 's#^\./##; s#[^A-Za-z0-9._-]#-#g')"
            echo "Processing module: $dir"
            (
              cd "$dir"
              go mod tidy
              go vet ./...
              go test -race ./...
              GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/dist/${module_name}-app" .
            )
          done < <(find . -name go.mod -not -path "./vendor/*" -print0)

      - name: Upload Go Artifacts
        if: hashFiles('dist/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-go-binaries
          path: dist/

      - name: Generate Build Provenance
        if: hashFiles('dist/*') != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

  stage-7-container:
    name: "7. Docker, Trivy & SBOM"
    runs-on: ubuntu-latest
    needs: [stage-1-secret-guard, stage-2-sast]
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Hadolint, Build & Trivy Image Scan
        shell: bash
        run: |
          idx=0
          while IFS= read -r -d '' df; do
            idx=$((idx + 1))
            dir="$(dirname "$df")"
            img="enterprise-audit-image:${idx}"
            echo "Auditing: $df"
            docker run --rm -i hadolint/hadolint:v2.12.0 < "$df" || true
            docker build --file "$df" --tag "$img" "$dir"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.58.2 image --severity CRITICAL,HIGH --exit-code 0 "$img"
          done < <(find . -type f -name "Dockerfile*" -not -path "./vendor/*" -print0)

      - name: Validate Docker Compose
        shell: bash
        run: |
          while IFS= read -r -d '' dc; do
            echo "Validating: $dc"
            docker compose -f "$dc" config -q
          done < <(find . -type f \( -name "docker-compose*.yml" -o -name "compose*.yml" \) -print0)

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: enterprise-sbom.spdx.json

      - name: Upload SBOM Evidence
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-sbom-bundle
          path: enterprise-sbom.spdx.json

  stage-8-kubernetes:
    name: "8. Kubernetes Manifest Validation"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Kubeconform
        shell: bash
        run: |
          curl -fsSL https://github.com \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Validate Kubernetes Manifests
        shell: bash
        run: |
          for dir in k8s kubernetes manifests; do
            [[ -d "$dir" ]] || continue
            while IFS= read -r -d '' file; do
              echo "Validating: $file"
              kubeconform -ignore-missing-schemas -summary "$file"
            done < <(find "$dir" -type f \( -name "*.yaml" -o -name "*.yml" \) -print0)
          done

  enterprise-release-gate:
    name: "FINAL - Enterprise Security Release Gate"
    runs-on: ubuntu-latest
    needs:
      - stage-1-secret-guard
      - stage-2-sast
      - stage-3-sca
      - stage-4-iac
      - stage-5-scripts
      - stage-6-go-engineering
      - stage-7-container
      - stage-8-kubernetes
    if: always()
    permissions:
      contents: read
    steps:
      - name: Verify All Security Stages
        shell: bash
        env:
          S1: ${{ needs.stage-1-secret-guard.result }}
          S2: ${{ needs.stage-2-sast.result }}
          S3: ${{ needs.stage-3-sca.result }}
          S4: ${{ needs.stage-4-iac.result }}
          S5: ${{ needs.stage-5-scripts.result }}
          S6: ${{ needs.stage-6-go-engineering.result }}
          S7: ${{ needs.stage-7-container.result }}
          S8: ${{ needs.stage-8-kubernetes.result }}
        run: |
          failed=0
          for stage in S1 S2 S3 S4 S5 S6 S7 S8; do
            result="${!stage}"
            echo "$stage : $result"
            if [[ "$result" != "success" ]]; then
              echo "::error::$stage verification failed: $result"
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "ENTERPRISE RELEASE GATE: FAIL"
            exit 1
          fi
          echo "ENTERPRISE CLOUD & DEVSECOPS SECURITY PLATFORM: PASS"
          
