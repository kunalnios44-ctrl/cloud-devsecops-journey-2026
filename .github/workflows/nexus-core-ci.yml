name: NORDIC NEXUS Core CI

on:
  push:
    paths:
      - "nexus-core/**"
      - ".github/workflows/nexus-core-ci.yml"
  pull_request:
    paths:
      - "nexus-core/**"
      - ".github/workflows/nexus-core-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-core
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nexus-core/pyproject.toml
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Run tests
        run: pytest
      - name: Evaluate sample inventory
        run: |
          set +e
          nexus-core evaluate examples/sample-inventory.json > report.json
          status=$?
          set -e
          test "$status" -eq 1
          python -c 'import json; r=json.load(open("report.json", encoding="utf-8")); assert r["summary"]["total"] == 6; assert r["summary"]["failed"] == 3'
