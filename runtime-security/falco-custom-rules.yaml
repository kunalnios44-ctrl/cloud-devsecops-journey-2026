- macro: spawn_critical_shell
  condition: evt.type = execve and container and (proc.name = "sh" or proc.name = "bash") and not container.image.repository startswith "trusted-registry/"

- rule: Detect Unauthorized Shell In Container
  desc: Detects an interactive shell spawned inside a production container.
  condition: spawn_critical_shell
  output: "Critical shell spawned (user=%user.name command=%proc.cmdline container_id=%container.id image=%container.image.repository)"
  priority: WARNING
  
