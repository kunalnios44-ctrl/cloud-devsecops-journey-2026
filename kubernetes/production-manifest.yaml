apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: Opaque
stringData:
  DB_PASS: "Denmark2027Secure!"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  TARGET_COUNTRY: "Denmark"
  TARGET_YEAR: "2027"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: denmark-prod-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: denmark-api
  template:
    metadata:
      labels:
        app: denmark-api
    spec:
      containers:
      - name: api
        image: nginx:1.26
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
        envFrom:
        - secretRef:
            name: db-secret
        - configMapRef:
            name: app-config
---
apiVersion: v1
kind: Service
metadata:
  name: denmark-api-service
spec:
  type: NodePort
  selector:
    app: denmark-api
  ports:
  - port: 80
    targetPort: 80
    
