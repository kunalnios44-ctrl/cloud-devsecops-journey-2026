apiVersion: apps/v1
kind: Deployment
metadata:
  name: nordic-nexus-nginx-demo
  labels:
    app.kubernetes.io/name: nordic-nexus-nginx-demo
    app.kubernetes.io/part-of: nordic-nexus
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nordic-nexus-nginx-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nordic-nexus-nginx-demo
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nordic-nexus-nginx-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nordic-nexus-nginx-demo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
